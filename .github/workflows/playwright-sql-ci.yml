
name: Playwright SQL Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
      SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker image
        run: docker compose build playwright-tests

      - name: Start SQL Server
        run: docker compose up -d sqlserver

      - name: Initialize database
        run: |
          docker compose run --rm --no-deps \
            playwright-tests python utils/init_database.py

      - name: Run Playwright checkout test
        run: |
          docker compose run --rm --no-deps \
            playwright-tests \
            python -m pytest tests/ \
            -v --browser chromium -s \
            --html=artifacts/report.html \
            --self-contained-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: artifacts/
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: docker compose down -v
