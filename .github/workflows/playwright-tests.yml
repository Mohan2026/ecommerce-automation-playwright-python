
name: Playwright UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Run cross-browser tests in Docker
        run: docker compose run --build --rm playwright-tests

      - name: Upload test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
